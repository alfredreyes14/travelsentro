name: Supabase migrations

# Pushes new migrations in supabase/migrations to the matching Supabase project.
#   staging branch -> "staging" GitHub environment
#   master branch  -> "production" GitHub environment
# PRs into either branch get a dry run against the target project so pending
# migrations are visible before merge.
#
# Each GitHub environment needs these secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_ID    project ref, e.g. abcdefghijklmnopqrst
#   SUPABASE_DB_PASSWORD   database password for that project

on:
  push:
    branches: [staging, master]
    paths:
      - "supabase/migrations/**"
  pull_request:
    branches: [staging, master]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    # Manual runs only from staging/master, so a feature branch can't push to staging.
    if: github.event_name == 'pull_request' || github.ref_name == 'staging' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'master' && 'production' || 'staging' }}
    # One migration run per target project at a time; never cancel a push mid-flight.
    concurrency:
      group: supabase-migrations-${{ github.base_ref || github.ref_name }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Pending migrations (dry run)
        run: supabase db push --dry-run

      - name: Push migrations
        if: github.event_name != 'pull_request'
        run: supabase db push
