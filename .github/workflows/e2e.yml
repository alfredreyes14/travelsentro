name: End-to-end tests

# Runs the Playwright tests (e2e/) against a fresh local Supabase with every
# migration applied, and fake email/SMS/Meta services (e2e/mock-server.ts).
# Nothing here touches the staging or production projects.

on:
  pull_request:
    branches: [staging, master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start local Supabase (applies every migration)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime

      - name: Read local Supabase keys
        run: |
          eval "$(supabase status -o env)"
          if [ -z "${API_URL:-}" ] || [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "supabase status didn't print API_URL / ANON_KEY / SERVICE_ROLE_KEY. It printed:"
            supabase status -o env | cut -d= -f1
            exit 1
          fi
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build the app
        run: npm run e2e:build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npm run e2e
        env:
          CI: "true"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
